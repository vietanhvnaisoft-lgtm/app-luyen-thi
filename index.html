          title: "TRẢ KẾT QUẢ & NHẬN XÉT CỦA GIA SƯ AI",
          icon: "analytics",
          theme: "purple",
          description: "Xem điểm số và lời phê của AI.",
          role: "AI & Học sinh",
          steps: [
            {
              title: "Tổng quan kết quả",
              subSteps: [
                {
                  text: "Kết quả chấm bài trả về ngay sau khi nộp.",
                  img: "./images/b6h1-tra-dap-an.png",
                },
                {
                  text: "Xem Tổng điểm, Thời gian làm bài, Số câu Đúng/Sai.",
                  img: "./images/b6h2-thong-tin-them.png",
                },
              ],
            },
            {
              title: "Chi tiết Trắc nghiệm",
              subSteps: [
                {
                  text: "Xem lại từng câu: Màu xanh (Đúng), Màu đỏ (Sai).",
                  img: "./images/b6h3-cham-trac-nghiem.png",
                },
              ],
            },
            {
              title: "Chi tiết Tự luận (AI Chấm)",
              subSteps: [
                {
                  text: "AI khoanh vùng lỗi sai và viết lời phê trực tiếp, giúp học sinh cải thiện kiến thức và củng cố kết quả làm bài trong những lần luyện thi tiếp theo.",
                  images: [
                    "./images/1.jpg",
                    "./images/2.jpg",
                  ],
                },
              ],
            },
          ],
        },
      ];

      let activeSectionId = 1;

      // --- DOM ---
      const navList = document.getElementById("nav-list");
      const contentContainer = document.querySelector(
        "#main-content .max-w-5xl"
      );
      const contentScrollArea = document.getElementById("content-scroll-area");
      const sidebar = document.getElementById("sidebar");
      const sidebarOverlay = document.getElementById("sidebar-overlay");
      const mobileMenuBtn = document.getElementById("mobile-menu-btn");
      const closeSidebarBtn = document.getElementById("close-sidebar-btn");

      // Modal
      const modal = document.getElementById("feature-modal");
      const modalBackdrop = document.getElementById("modal-backdrop");
      const modalContent = document.getElementById("modal-content");
      const modalImage = document.getElementById("modal-image");
      const modalImageWrapper = document.getElementById("modal-image-wrapper");
      const modalHeaderBg = document.getElementById("modal-header-bg");
      const modalTagContainer = document.getElementById("modal-tag-container");
      const modalTitle = document.getElementById("modal-title");
      const modalDesc = document.getElementById("modal-desc");

      // --- FUNCTIONS ---

      function openFeaturePopup(feature, theme) {
        modalTitle.innerText = feature.name;
        modalDesc.innerText = feature.desc || "Thông tin chi tiết tính năng.";
        modalImage.src =
          feature.image || `https://placehold.co/800x400?text=${feature.name}`;

        const color = feature.color || theme;

        // Dynamic Styles based on Tag Color
        modalTagContainer.innerHTML = `<span class="inline-block py-1 px-3 rounded-lg bg-${color}-100 text-${color}-700 text-sm font-bold uppercase">Chi tiết</span>`;

        // Updated Image Wrapper Styling: Rectangular, rounded corners, auto size, NO CIRCLE
        modalImageWrapper.className = `rounded-lg border-4 bg-white p-1 shadow-2xl transition-colors duration-300 mx-auto border-${color}-500 inline-block`;
        // Updated Header Background: Soft color matching the tag
        modalHeaderBg.className = `w-full py-10 flex justify-center relative shrink-0 transition-colors duration-300 bg-${color}-50`;

        modal.classList.remove("hidden");
        setTimeout(() => {
          modalBackdrop.classList.remove("opacity-0");
          modalContent.classList.remove("opacity-0", "scale-95");
          modalContent.classList.add("opacity-100", "scale-100");
        }, 10);
      }

      function closeModal() {
        modalBackdrop.classList.add("opacity-0");
        modalContent.classList.remove("opacity-100", "scale-100");
        modalContent.classList.add("opacity-0", "scale-95");
        setTimeout(() => modal.classList.add("hidden"), 200);
      }
      modalBackdrop.onclick = closeModal;

      function renderSidebar() {
        navList.innerHTML = "";
        guideData.forEach((section) => {
          const isActive = section.id === activeSectionId;
          const button = document.createElement("button");

          let baseClasses =
            "w-full text-left px-5 py-5 flex items-center group transition-all duration-200 rounded-xl border mb-2 ";
          let activeClasses = isActive
            ? `bg-${section.theme}-50 border-${section.theme}-200 text-${section.theme}-900 shadow-sm`
            : "bg-transparent border-transparent text-slate-600 hover:bg-slate-50 hover:text-slate-900";

          button.className = baseClasses + activeClasses;

          button.innerHTML = `
                    <span class="mr-4 p-2.5 rounded-lg transition-colors flex items-center justify-center ${
                      isActive
                        ? `bg-${section.theme}-600 text-white`
                        : "bg-slate-100 text-slate-500"
                    }">
                        <span class="material-symbols-outlined">${
                          section.icon
                        }</span>
                    </span>
                    <div class="flex-1">
                        <div class="text-base font-bold">${section.title}</div>
                        <div class="text-xs font-medium text-slate-400 mt-0.5">Bước ${
                          section.id
                        }</div>
                    </div>
                `;
          button.onclick = () => {
            activeSectionId = section.id;
            renderSidebar();
            renderContent();
            if (window.innerWidth < 768) toggleMobileSidebar(false);
          };
          navList.appendChild(button);
        });
      }

      function renderContent() {
        const section = guideData.find((s) => s.id === activeSectionId);
        if (!section) return;

        contentScrollArea.scrollTop = 0;

        let html = `
                <div class="mb-12 pb-8 border-b border-slate-200 fade-in">
                    <div class="flex items-center space-x-6 mb-6">
                        <span class="flex-shrink-0 flex items-center justify-center w-16 h-16 rounded-2xl bg-${section.theme}-600 text-white font-extrabold text-3xl shadow-lg">
                            ${section.id}
                        </span>
                        <div>
                            <h2 class="text-4xl font-extrabold text-slate-900">${section.title}</h2>
                        </div>
                    </div>
                    <p class="text-xl text-slate-600 pl-24">${section.description}</p>
                </div>
                <div class="space-y-12 pl-0 md:pl-6">
            `;

        section.steps.forEach((step, index) => {
          const stepNum = index + 1;

          // --- NEW LOOP: PAIR CONTENT TEXT WITH IMAGE ---
          // Loop through 'subSteps' array
          let subStepsHtml = "";
          if (step.subSteps && step.subSteps.length > 0) {
            subStepsHtml = step.subSteps
              .map((sub) => {
                // Logic to handle multiple images
                let imageContent = "";

                if (sub.images && sub.images.length > 0) {
                  // Render multiple images in a Grid 2x2 (or 2 columns)
                  const imgs = sub.images
                    .map(
                      (src) => `
                            <div class="w-full">
                                <img 
                                    src="${src}" 
                                    alt="Minh họa" 
                                    class="max-w-full h-auto rounded-lg"
                                    loading="lazy"
                                />
                            </div>
                        `
                    )
                    .join("");

                  // Use GRID with 2 columns.
                  // If 2 images -> 1 row.
                  // If 4 images -> 2 rows (2x2).
                  imageContent = `
                            <div class="grid grid-cols-2 gap-4">
                                ${imgs}
                            </div>
                        `;
                } else if (sub.img) {
                  // Render single image
                  imageContent = `
                            <img 
                                src="${sub.img}" 
                                alt="Minh họa bước thực hiện" 
                                class="max-w-full h-auto rounded-lg"
                                loading="lazy"
                            />
                        `;
                }

                return `
                        <div class="mb-10 last:mb-0 group">
                            <!-- Text Line -->
                            <div class="flex items-start mb-4">
                                <span class="mt-1.5 w-6 h-6 flex items-center justify-center rounded-full bg-${section.theme}-100 text-${section.theme}-600 mr-4 flex-shrink-0">
                                    <span class="material-symbols-outlined text-sm font-bold">arrow_downward</span>
                                </span>
                                <p class="text-lg md:text-xl text-slate-800 font-medium leading-relaxed">${sub.text}</p>
                            </div>
                            
                            <!-- Image Block (NO FRAME) -->
                            <div class="pl-10">
                                ${imageContent}
                            </div>
                        </div>
                    `;
              })
              .join("");
          }

          // Interactive Buttons (Updated Styling)
          let interactiveBlock = "";
          if (step.interactiveFeatures) {
            const buttons = step.interactiveFeatures
              .map((f) => {
                const fStr = JSON.stringify(f).replace(/"/g, "&quot;");
                // Dynamic color classes based on f.color
                const colorClass = f.color
                  ? `bg-${f.color}-100 text-${f.color}-700 hover:bg-${f.color}-200`
                  : `bg-slate-100 text-slate-700 hover:bg-slate-200`;

                return `<button onclick="openFeaturePopup(${fStr}, '${section.theme}')" class="px-6 py-3 rounded-full font-bold text-sm transition-all transform hover:scale-105 shadow-sm border border-transparent hover:shadow-md mx-2 mb-3 ${colorClass}">
                    <span class="mr-1">#</span> ${f.name}
                </button>`;
              })
              .join("");

            // Added 'text-center' and 'justify-center'
            interactiveBlock = `
                <div class="mt-8 p-6 bg-slate-50/50 rounded-2xl border border-slate-100 text-center">
                    <div class="text-xs font-extrabold text-slate-400 uppercase tracking-widest mb-4">Các tính năng tương tác</div>
                    <div class="flex flex-wrap justify-center items-center">
                        ${buttons}
                    </div>
                </div>`;
          }

          // Render Step Card
          html += `
                    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 overflow-hidden ring-1 ring-slate-100 fade-in" style="animation-delay: ${
                      index * 0.1
                    }s">
                        <div class="border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white px-8 py-6">
                            <h3 class="font-bold text-2xl text-slate-800 flex items-center">
                                <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-${
                                  section.theme
                                }-100 text-${
            section.theme
          }-600 text-lg font-black mr-4 border border-${section.theme}-200">
                                    ${stepNum}
                                </span>
                                ${step.title}
                            </h3>
                        </div>
                        <div class="p-8 md:p-10">
                            ${subStepsHtml}
                            ${interactiveBlock}
                            ${
                              step.notes
                                ? `<div class="mt-6 bg-amber-50 p-4 rounded-lg text-amber-800 text-sm border-l-4 border-amber-400"><strong>Lưu ý:</strong> ${step.notes.join(
                                    " "
                                  )}</div>`
                                : ""
                            }
                        </div>
                    </div>
                `;
        });

        html += `</div><div class="h-20"></div>`; // Bottom spacer
        contentContainer.innerHTML = html;
      }

      function toggleMobileSidebar(show) {
        if (show) {
          sidebar.classList.remove("-translate-x-full");
          sidebarOverlay.classList.remove("hidden");
        } else {
          sidebar.classList.add("-translate-x-full");
          sidebarOverlay.classList.add("hidden");
        }
      }
      mobileMenuBtn.onclick = () => toggleMobileSidebar(true);
      closeSidebarBtn.onclick = () => toggleMobileSidebar(false);
      sidebarOverlay.onclick = () => toggleMobileSidebar(false);

      renderSidebar();
      renderContent();
    </script>
  </body>
</html>
